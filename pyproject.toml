[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddyn"
version = "0.0.1"
authors = [{name = "Antmicro Ltd.", email = "contact@antmicro.com"}]
description = "Embeddyn integrated mechatronic emulation, co-simulation and digital-twin platform"
dependencies = [
    "pyrenode3[all]   @ git+https://github.com/antmicro/pyrenode3@e74fed065cf3a49beeaa94fd5bf2d72b8b7e1988",
    "pipeline-manager @ git+https://github.com/antmicro/kenning-pipeline-manager@0b8fffc24c7721d09da728c6c9bcd37a45092d26",
    "pipeline-manager-backend-communication @ git+https://github.com/antmicro/kenning-pipeline-manager-backend-communication@eb690cfb7766bfbd85a4eff2a1e809573b8b72d0",

    # XXX: dts2repl version should be synced with the Renode version (which is
    #      specified in embeddyn/init.py file). Eventually, it will be specified by
    #      the Renode, but currently we have to do it manually. When updating
    #      he version here, please check if Renode shouldn't be updated as well.
    "dts2repl         @ git+https://github.com/antmicro/dts2repl@83e2d743202684eb1f89a1b93e859c69cd736455",

    "pyyaml",
    "typer",
    "west",
    "Jinja2",
]

requires-python = ">=3.9"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
embeddyn = "embeddyn.__main__:main"
vsd = "embeddyn.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
include = ["embeddyn*", "vsd*"]

[tool.setuptools.package-data]
embeddyn = [
    "templates/*",
    "spec_mods/*.json",
    "local/static/*",
    "local/assets/*",
    "mechatronics/gui/static/*",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "platformdirs>=4.2",
    "numpy>=1.24",
    "pyelftools>=0.31",
    "capstone>=5.0",
    "psutil>=5.9",
]
mujoco = [
    "mujoco>=3.5",
]
fmi = [
    "fmpy>=0.3.30",
    "pythonfmu3>=1.3",
]
mechatronics-storage = [
    "pyarrow>=15",
]
rf = [
    "scikit-rf>=1.9,<3",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
