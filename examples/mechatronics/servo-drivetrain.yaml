name: geared-servo-drivetrain
step_seconds: 0.0005
duration_seconds: 1.0
metadata:
  description: >
    Speed-controlled DC motor driving a geared load through a gearbox with
    backlash and a compliant shaft; load friction with Stribeck effect; load
    encoder; winding temperature feeding back into the motor resistance.
    Firmware and electrical use the built-in models here; swap in Renode and
    ngspice-shared as in dc-motor-full.yaml.

parameters:
  motor.k: {value: 0.08, unit: N*m/A}   # torque constant Kt = back-EMF constant Ke (V*s/rad), declared once
  controller.kp: 0.5
  controller.ki: 4.0
  controller.anti_windup: 1
  drivetrain.backlash: {value: 0.004, unit: rad}
  thermal.initial_temperature: 25.0
  drivetrain.load_inertia: 1.2
  drivetrain.coulomb_friction: 0.25
  motor.resistance_20c: 2.0

simulators:
  firmware:
    options: {backend: mock}
  electrical:
    options: {backend: mock}
  mechanical:
    model: "embeddyn.mechatronics.plants:GearedDrivetrain"
    options:
      backend: python
      max_step: 2.0e-5
      parameters:
        motor_inertia: 0.002
        gear_ratio: 10
        backlash: "@drivetrain.backlash"
        shaft_stiffness: 3000
        shaft_damping: 3
        load_inertia: "@drivetrain.load_inertia"
        load_damping: 0.05
        coulomb_friction: "@drivetrain.coulomb_friction"
        static_friction: 0.4
        stribeck_speed: 0.05
        friction_speed: 0.002
        encoder_cpr: 4096
      inputs: {motor_torque: mechanical.motor_torque, load_torque: mechanical.load_torque}
      outputs:
        motor_speed: mechanical.velocity
        motor_angle: mechanical.position
        motor_acceleration: mechanical.acceleration
        load_speed: mechanical.load_velocity
        load_angle: mechanical.load_position
        shaft_torque: mechanical.shaft_torque
        encoder_count: mechanical.encoder_count
        backlash_contact: mechanical.backlash_contact
        dissipated_power: mechanical.dissipated_power
        stored_energy: mechanical.stored_energy
  thermal:
    model: "embeddyn.mechatronics.plants:ThermalRC"
    options:
      backend: python
      max_step: 1.0e-3
      parameters: {thermal_resistance: 3.0, thermal_capacitance: 10.0, resistance_20c: "@motor.resistance_20c", initial_temperature: "@thermal.initial_temperature"}
      inputs: {current: electrical.motor_current, ambient: thermal.ambient}
      outputs: {temperature: thermal.winding_temperature, resistance: thermal.winding_resistance, copper_loss: thermal.copper_loss}

signals:
  firmware.target_velocity: {domain: firmware, unit: rad/s, initial: 8.0}
  firmware.measured_velocity: {domain: firmware, unit: rad/s, initial: 0.0}
  firmware.pwm_duty: {domain: firmware, initial: 0.0, min: -1.0, max: 1.0}
  firmware.control_error: {domain: firmware, unit: rad/s, initial: 0.0}
  electrical.pwm_duty: {domain: electrical, initial: 0.0, min: -1.0, max: 1.0}
  electrical.supply_voltage: {domain: electrical, unit: V, initial: 24.0}
  electrical.motor_resistance: {domain: electrical, unit: ohm, initial: 2.0}
  electrical.motor_inductance: {domain: electrical, unit: H, initial: 0.003}
  electrical.back_emf: {domain: electrical, unit: V, initial: 0.0}
  electrical.motor_voltage: {domain: electrical, unit: V, initial: 0.0}
  electrical.motor_current: {domain: electrical, unit: A, initial: 0.0}
  electrical.input_power: {domain: electrical, unit: W, initial: 0.0}
  mechanical.motor_torque: {domain: mechanical, unit: N*m, initial: 0.0}
  mechanical.load_torque: {domain: mechanical, unit: N*m, initial: 0.3}
  mechanical.position: {domain: mechanical, unit: rad, initial: 0.0}
  mechanical.velocity: {domain: mechanical, unit: rad/s, initial: 0.0}
  mechanical.acceleration: {domain: mechanical, unit: rad/s^2, initial: 0.0}
  mechanical.load_position: {domain: mechanical, unit: rad, initial: 0.0}
  mechanical.load_velocity: {domain: mechanical, unit: rad/s, initial: 0.0}
  mechanical.shaft_torque: {domain: mechanical, unit: N*m, initial: 0.0}
  mechanical.encoder_count: {domain: mechanical, initial: 0.0}
  mechanical.backlash_contact: {domain: mechanical, initial: 0.0}
  mechanical.dissipated_power: {domain: mechanical, unit: W, initial: 0.0}
  mechanical.stored_energy: {domain: mechanical, unit: J, initial: 0.0}
  thermal.ambient: {domain: thermal, unit: degC, initial: 25.0}
  thermal.winding_temperature: {domain: thermal, unit: degC, initial: 25.0}
  thermal.winding_resistance: {domain: thermal, unit: ohm, initial: 2.0}
  thermal.copper_loss: {domain: thermal, unit: W, initial: 0.0}

couplings:
  - {source: firmware.pwm_duty, target: electrical.pwm_duty}
  - {source: mechanical.velocity, target: electrical.back_emf, gain: "@motor.k", delay_steps: 1}
  - {source: electrical.motor_current, target: mechanical.motor_torque, gain: "@motor.k"}
  - {source: mechanical.velocity, target: firmware.measured_velocity, delay_steps: 1}
  - {source: thermal.winding_resistance, target: electrical.motor_resistance, delay_steps: 1}

metrics:
  speed: {type: step_response, signal: mechanical.velocity, target: firmware.target_velocity}
  current: {type: stats, signal: electrical.motor_current}
  energy: {type: integral, signal: electrical.input_power}
  shaft: {type: stats, signal: mechanical.shaft_torque}
  temperature: {type: stats, signal: thermal.winding_temperature}

verification:
  energy:
    # Electrical input = copper loss + drivetrain losses (bearings, friction, shaft damper)
    # + work on the external load + change in magnetic and drivetrain (kinetic + spring) energy.
    tolerance: 0.02
    sources: [{name: electrical_input, product: [electrical.motor_voltage, electrical.motor_current]}]
    sinks:
      - {name: copper, product: [electrical.motor_current, electrical.motor_current, electrical.motor_resistance]}
      - {name: drivetrain_losses, signal: mechanical.dissipated_power}
      - {name: external_load, product: [mechanical.load_torque, mechanical.load_velocity]}
    storage:
      - {name: inductance, product: [0.5, electrical.motor_inductance, electrical.motor_current, electrical.motor_current]}
      - {name: drivetrain, signal: mechanical.stored_energy}
  convergence:
    signals: [mechanical.velocity, mechanical.load_velocity, electrical.motor_current, thermal.winding_temperature]
    tolerance: 0.01
    duration: 0.5
  scenarios:
    - name: no-backlash
      parameters: {drivetrain.backlash: 0.0}
      expect: [{metric: speed.overshoot, max: 40.0}, {metric: shaft.peak, max: 25.0}]
    - name: worn-gearbox
      parameters: {drivetrain.backlash: 0.02}
      expect: [{metric: speed.final_value, min: 7.5}, {metric: shaft.peak, max: 25.0}]
    # Hot ambient and a pre-heated winding: higher resistance, less torque per volt.
    - name: hot-start
      parameters: {thermal.initial_temperature: 60.0}
      signals: {thermal.ambient: 60.0, thermal.winding_temperature: 60.0, electrical.motor_resistance: 2.31}
      expect: [{metric: temperature.min, min: 60.0}, {metric: temperature.max, max: 80.0}, {metric: speed.final_value, min: 7.5}]

