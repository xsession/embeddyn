# SMD marking codes: the short top-marks small packages carry instead of the part number.
#
# Built in: common, widely second-sourced parts whose codes are stable across makers. A code is not unique:
# the same two characters mean different parts from different makers and in different packages, so a lookup
# gives candidates, ranked by package. "confidence: check" marks codes worth confirming in the datasheet.
#
# More codes: put CSV/YAML/JSON files in ~/.config/embeddyn/smd-codes/ (or list them in $EMBEDDYN_SMD_CODES);
# CSV columns: code,package,part,maker,function[,pins][,confidence][,prefix]. "prefix: true" means the code is
# only the start of the marking (the rest is a date or lot code, e.g. Microchip and TI small packages).
#
# Nexperia (and Philips/NXP before it) append a site letter to the code (p, t, W, %): "1Ft" is code "1F". The
# decoder strips it.
